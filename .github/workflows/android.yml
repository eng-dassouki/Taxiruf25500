name: Android APK # feste Signatur

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Feste Debug-Signatur
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android; echo "$KS" | base64 -d > ~/.android/debug.keystore; echo "Feste Signatur aktiv"; else echo "KEIN Secret DEBUG_KEYSTORE_B64"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: Symbol und Version
        run: |
          if [ -f icon.png ]; then
            mkdir -p resources
            cp icon*.png resources/
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android || true
          fi
          sed -i 's/versionCode 1/versionCode '$GITHUB_RUN_NUMBER'/' android/app/build.gradle

      - name: Push-Konfiguration
        run: |
          M=android/app/src/main/AndroidManifest.xml
          R=android/app/src/main/res
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "google-services.json gefunden"; else echo "KEINE google-services.json - Push-Nachrichten sind dann aus"; fi
          mkdir -p $R/drawable $R/values
          if [ -f ic_stat_taxi.png ]; then cp ic_stat_taxi.png $R/drawable/ic_stat_taxi.png; fi
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ds_red">#C8102E</color></resources>' > $R/values/ds_colors.xml
          sed -i 's#</application>#<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_taxi"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/ds_red"/><meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="taxi"/></application>#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-feature android:name="android.hardware.location.gps" android:required="false"/><application#' $M

      - name: Feste Signatur und App-Updater
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/><application#' $M
          sed -i 's#</activity>#<intent-filter android:autoVerify="true"><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="https" android:host="taxi-muenster.de" android:pathPrefix="/booking"/></intent-filter></activity>#' $M
          D=android/app/src/main/java/de/taxiruf25500/customer
          mkdir -p $D
          cat > $D/ApkUpdaterPlugin.java <<'EOF_P'
          package de.taxiruf25500.customer;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          @CapacitorPlugin(name = "ApkUpdater")
          public class ApkUpdaterPlugin extends Plugin {

              @PluginMethod
              public void install(final PluginCall call) {
                  final String url = call.getString("url");
                  if (url == null || !url.startsWith("https://")) { call.reject("url"); return; }
                  if (Build.VERSION.SDK_INT >= 26 && !getContext().getPackageManager().canRequestPackageInstalls()) {
                      Intent s = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + getContext().getPackageName()));
                      s.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(s);
                      JSObject r = new JSObject(); r.put("status", "need_permission"); call.resolve(r);
                      return;
                  }
                  new Thread(new Runnable() {
                      @Override public void run() {
                          try {
                              File dir = new File(getContext().getCacheDir(), "update"); dir.mkdirs();
                              File[] old = dir.listFiles(); if (old != null) for (File f : old) f.delete();
                              File out = new File(dir, "Taxiruf.apk");
                              HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                              c.setInstanceFollowRedirects(true); c.setConnectTimeout(20000); c.setReadTimeout(30000);
                              c.connect();
                              if (c.getResponseCode() != 200) throw new Exception("HTTP " + c.getResponseCode());
                              long total = c.getContentLengthLong(); long got = 0; int last = -1;
                              InputStream in = c.getInputStream(); FileOutputStream fo = new FileOutputStream(out);
                              byte[] b = new byte[65536]; int n;
                              while ((n = in.read(b)) > 0) {
                                  fo.write(b, 0, n); got += n;
                                  if (total > 0) { int p = (int) (got * 100 / total); if (p != last) { last = p; JSObject e = new JSObject(); e.put("percent", p); notifyListeners("progress", e); } }
                              }
                              fo.close(); in.close();
                              if (out.length() < 1000000) throw new Exception("Datei zu klein");
                              Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", out);
                              Intent i = new Intent(Intent.ACTION_VIEW);
                              i.setDataAndType(uri, "application/vnd.android.package-archive");
                              i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                              getContext().startActivity(i);
                              JSObject r = new JSObject(); r.put("status", "installing"); call.resolve(r);
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          }
                      }
                  }).start();
              }
          }
          EOF_P
          cat > $D/MainActivity.java <<'EOF_M'
          package de.taxiruf25500.customer;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF_M
          mkdir -p android/app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><external-path name="my_images" path="."/><cache-path name="my_cache_images" path="."/></paths>' > android/app/src/main/res/xml/file_paths.xml

      - name: Taxi-Ton fuer Push (Kanal taxi_beep)
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PYEOF'
          import math,struct,wave
          sr=22050; out=[]
          def add(f,t0,d,g,sq=False):
              for i in range(int(d*sr)):
                  t=i/sr; env=min(1,t/0.01)*max(0,1-t/d)**(0.3 if sq else 1)
                  v=math.sin(2*math.pi*f*t)
                  if sq: v=1 if v>0 else -1
                  k=int(t0*sr)+i
                  while len(out)<=k: out.append(0)
                  out[k]+=v*env*g
          for t0,d in ((0,0.17),(0.24,0.22)):
              add(392,t0,d,0.22,True); add(494,t0,d,0.22,True)
          for f,t0,d in ((784,0.62,0.5),(988,0.74,0.5),(1175,0.86,0.55),(1568,1.0,1.1)):
              add(f,t0,d,0.35); add(f*2.01,t0,d*0.5,0.1)
          m=max(abs(x) for x in out)
          w=wave.open('android/app/src/main/res/raw/taxi_beep.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
          w.writeframes(b''.join(struct.pack('<h',int(x/m*0.8*32767)) for x in out)); w.close()
          PYEOF
          ls -la android/app/src/main/res/raw

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Taxiruf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Taxiruf-APK
          path: Taxiruf.apk


  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Taxiruf-APK
          path: out
      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          APK=$(find out -name '*.apk' | head -1)
          cp "$APK" Taxiruf.apk
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create latest Taxiruf.apk --repo "$GITHUB_REPOSITORY" --title "Taxiruf 25500 App" --notes "Aktuelle Android-App" --latest
