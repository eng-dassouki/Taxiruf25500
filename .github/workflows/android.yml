name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: Symbol und Version
        run: |
          if [ -f icon.png ]; then
            mkdir -p resources
            cp icon*.png resources/
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android || true
          fi
          sed -i 's/versionCode 1/versionCode '$GITHUB_RUN_NUMBER'/' android/app/build.gradle

      - name: Push-Konfiguration
        run: |
          M=android/app/src/main/AndroidManifest.xml
          R=android/app/src/main/res
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; echo "google-services.json gefunden"; else echo "KEINE google-services.json - Push-Nachrichten sind dann aus"; fi
          mkdir -p $R/drawable $R/values
          if [ -f ic_stat_taxi.png ]; then cp ic_stat_taxi.png $R/drawable/ic_stat_taxi.png; fi
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ds_red">#C8102E</color></resources>' > $R/values/ds_colors.xml
          sed -i 's#</application>#<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_taxi"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/ds_red"/><meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="taxi"/></application>#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-feature android:name="android.hardware.location.gps" android:required="false"/><application#' $M

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Taxiruf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Taxiruf-APK
          path: Taxiruf.apk


  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Taxiruf-APK
          path: out
      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          APK=$(find out -name '*.apk' | head -1)
          cp "$APK" Taxiruf.apk
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          gh release create latest Taxiruf.apk --repo "$GITHUB_REPOSITORY" --title "Taxiruf 25500 App" --notes "Aktuelle Android-App" --latest
