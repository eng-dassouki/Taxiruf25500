name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Android-Projekt erzeugen
        run: |
          npx cap add android
          npx cap sync android

      - name: Symbol und Version
        run: |
          if [ -f resources/icon.png ]; then
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android || true
          fi
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Taxiruf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Taxiruf-APK
          path: Taxiruf.apk
